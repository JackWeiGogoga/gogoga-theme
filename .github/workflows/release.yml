# Push a tag equal to manifest.json's version (e.g. 0.1.1, no "v") to publish a release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # 说明取自 CHANGELOG.zh-CN.md / CHANGELOG.md 里这个版本的条目；没写就失败，先写更新日志再发版
          node scripts/release-notes.mjs "$tag" > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md manifest.json theme.css
