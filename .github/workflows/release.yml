# Push a tag equal to manifest.json's version (e.g. 0.1.1, no "v") to publish a release.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  # 构建来源证明（artifact attestation）：用户和插件市场可以验证 Release 里的文件是这个仓库的 CI 构建的
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            manifest.json
            theme.css
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # 说明取自 CHANGELOG.zh-CN.md / CHANGELOG.md 里这个版本的条目；没写就失败，先写更新日志再发版
          node scripts/release-notes.mjs "$tag" > release-notes.md
          gh release create "$tag" --title "$tag" --notes-file release-notes.md manifest.json theme.css
